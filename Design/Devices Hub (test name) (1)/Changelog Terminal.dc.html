<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #16181D; }
  a { color: #29B6F6; text-decoration: none; border-bottom: 1px solid rgba(41,182,246,0.35); }
  a:hover { color: #7FD3FF; border-bottom-color: rgba(127,211,255,0.6); }
  @keyframes caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
</style>
</helmet>

<div style="min-height: 100vh; padding: 64px 40px; background: #16181D; display: flex; justify-content: center; align-items: flex-start; font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, monospace;">
  <div style="width: 100%; max-width: 900px; border-radius: 10px; background: #0C0E12; border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 30px 70px rgba(0,0,0,0.55); overflow: hidden;">

    <sc-if value="{{ chromeMac }}" hint-placeholder-val="{{ true }}">
      <div style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #15181E; border-bottom: 1px solid rgba(255,255,255,0.07);">
        <div style="width: 11px; height: 11px; border-radius: 50%; background: #FF5F57;"></div>
        <div style="width: 11px; height: 11px; border-radius: 50%; background: #FEBC2E;"></div>
        <div style="width: 11px; height: 11px; border-radius: 50%; background: #28C840;"></div>
        <div style="flex: 1; text-align: center; font-size: 12px; color: #7C838F; letter-spacing: 0.02em; margin-right: 47px;">changelog — zsh</div>
      </div>
    </sc-if>

    <sc-if value="{{ chromeWin }}">
      <div style="height: 40px; display: flex; align-items: stretch; background: #15181E; border-bottom: 1px solid rgba(255,255,255,0.07);">
        <div style="display: flex; align-items: center; gap: 9px; padding: 0 16px; font-size: 12px; color: #C8CDD6;">
          <div style="width: 13px; height: 13px; border-radius: 3px; background: #29B6F6;"></div>
          changelog
        </div>
        <div style="flex: 1;"></div>
        <div style="width: 44px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #C8CDD6;" style-hover="background: rgba(255,255,255,0.06)">&#9472;</div>
        <div style="width: 44px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #C8CDD6;" style-hover="background: rgba(255,255,255,0.06)">&#9633;</div>
        <div style="width: 44px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #C8CDD6;" style-hover="background: #C42B1C">&#10005;</div>
      </div>
    </sc-if>

    <div style="padding: 28px 30px 34px; display: flex; flex-direction: column; gap: 18px; font-size: 16px; line-height: 1.65;">

      <div style="display: flex; gap: 10px; align-items: baseline;">
        <div style="color: #5A6472; flex: none;">$</div>
        <div style="color: #E4E8EE;">cat CHANGELOG.md</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; color: #E4E8EE;">
        <div style="display: flex; gap: 14px; align-items: baseline;">
          <div style="color: #29B6F6; flex: none;">&#8226;</div>
          <div style="text-wrap: pretty;">оптимизия загрузкт изображений</div>
        </div>
        <div style="display: flex; gap: 14px; align-items: baseline;">
          <div style="color: #29B6F6; flex: none;">&#8226;</div>
          <div style="text-wrap: pretty;">улучшили индекс в <a href="https://pagespeed.web.dev">https://pagespeed.web.dev</a></div>
        </div>
        <div style="display: flex; gap: 14px; align-items: baseline;">
          <div style="color: #29B6F6; flex: none;">&#8226;</div>
          <div style="text-wrap: pretty;">почти все готово по мобильной версии</div>
        </div>
        <div style="display: flex; gap: 14px; align-items: baseline;">
          <div style="color: #29B6F6; flex: none;">&#8226;</div>
          <div style="text-wrap: pretty;">новые страницы: Умови використання; Політика конфіденційності; Сертифікати</div>
        </div>
        <div style="display: flex; gap: 14px; align-items: baseline;">
          <div style="color: #29B6F6; flex: none;">&#8226;</div>
          <div style="text-wrap: pretty;">правки по прошлым страницам</div>
        </div>
      </div>

      <div style="display: flex; gap: 10px; align-items: center;">
        <div style="color: #5A6472; flex: none;">$</div>
        <sc-if value="{{ showCursor }}" hint-placeholder-val="{{ true }}">
          <div style="width: 9px; height: 19px; background: #29B6F6; animation: caret 1.1s step-end infinite;"></div>
        </sc-if>
      </div>

    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;chrome&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;macOS&quot;,&quot;Windows&quot;,&quot;Без рамки&quot;],&quot;default&quot;:&quot;macOS&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showCursor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const chrome = this.props.chrome ?? 'macOS';
    return {
      chromeMac: chrome === 'macOS',
      chromeWin: chrome === 'Windows',
      showCursor: this.props.showCursor ?? true
    };
  }
}

</script>
</body>
</html>
